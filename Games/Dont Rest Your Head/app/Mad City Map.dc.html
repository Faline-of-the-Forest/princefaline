<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./js/madcity-seed.js"></script>
<script src="./js/madcity-io.js"></script>
<script>try { if (!localStorage.getItem('dryh_madcity_map_v1') && window.DRYH_MADCITY_SEED) localStorage.setItem('dryh_madcity_map_v1', JSON.stringify(window.DRYH_MADCITY_SEED)); } catch (e) {}</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:#050506;}
    *{box-sizing:border-box;}
    a{color:oklch(0.55 0.21 27);}
    a:hover{color:oklch(0.68 0.19 30);}
    button{font-family:'Barlow',sans-serif; font-weight:600;}
    input,textarea{outline:none;}
    textarea::placeholder,input::placeholder{color:oklch(0.5 0.01 70);}
    ::-webkit-scrollbar{width:6px;height:6px;}
    ::-webkit-scrollbar-thumb{background:oklch(0.4 0.01 60);}
    @keyframes mc-in{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}
  </style>
</helmet>
<div style="{{ rootStyle }}">
  <div style="position:relative; z-index:20; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:12px 26px; background:rgba(4,4,5,0.92); border-bottom:1px solid oklch(0.93 0.012 85 / 0.5);">
    <div style="display:flex; align-items:baseline; gap:16px;">
      <span style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:30px; line-height:1; letter-spacing:0.02em; text-transform:uppercase; color:oklch(0.96 0.012 85);">Mad City</span>
      
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button onClick="{{ onAddNode }}" style="height:32px; padding:0 14px; background:transparent; border:1px solid oklch(0.55 0.21 27); color:oklch(0.68 0.19 30); font-size:12.5px; font-weight:600; letter-spacing:0.18em; cursor:pointer;" style-hover="background:oklch(0.55 0.21 27); color:oklch(0.97 0.01 85);">+ LOCATION</button>
      <button onClick="{{ onExportMd }}" style="height:32px; padding:0 12px; background:transparent; border:1px solid oklch(0.93 0.012 85 / 0.35); color:oklch(0.9 0.01 80); font-size:12px; letter-spacing:0.18em; cursor:pointer;" style-hover="border-color:oklch(0.95 0.012 85);">EXPORT .MD</button>
      <button onClick="{{ onImportMd }}" style="height:32px; padding:0 12px; background:transparent; border:1px solid oklch(0.93 0.012 85 / 0.35); color:oklch(0.9 0.01 80); font-size:12px; letter-spacing:0.18em; cursor:pointer;" style-hover="border-color:oklch(0.95 0.012 85);">IMPORT .MD</button>
      <span style="width:1px; height:20px; background:oklch(0.93 0.012 85 / 0.25); margin:0 4px;"></span>
      <button onClick="{{ onZoomOut }}" title="Zoom out" style="width:32px; height:32px; padding:0; background:transparent; border:1px solid oklch(0.93 0.012 85 / 0.35); color:oklch(0.9 0.01 80); font-size:16px; cursor:pointer;" style-hover="border-color:oklch(0.95 0.012 85);">−</button>
      <span style="min-width:44px; text-align:center; font-family:'Barlow',sans-serif; font-weight:600; font-size:13px; color:oklch(0.85 0.01 80);">{{ zoomText }}</span>
      <button onClick="{{ onZoomIn }}" title="Zoom in" style="width:32px; height:32px; padding:0; background:transparent; border:1px solid oklch(0.93 0.012 85 / 0.35); color:oklch(0.9 0.01 80); font-size:16px; cursor:pointer;" style-hover="border-color:oklch(0.95 0.012 85);">+</button>
      <button onClick="{{ onFit }}" title="Fit all locations" style="height:32px; padding:0 12px; background:transparent; border:1px solid oklch(0.93 0.012 85 / 0.35); color:oklch(0.9 0.01 80); font-size:12px; letter-spacing:0.18em; cursor:pointer;" style-hover="border-color:oklch(0.95 0.012 85);">FIT</button>
    </div>
  </div>

  <div ref="{{ canvasRef }}" onMouseDown="{{ onCanvasDown }}" onDoubleClick="{{ onCanvasDbl }}" style="{{ canvasStyle }}">
    <div style="{{ worldStyle }}">
      <svg width="1" height="1" style="position:absolute; left:0; top:0; overflow:visible; pointer-events:none; z-index:0;">
        <defs>
          <marker id="mc-arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 z" fill="oklch(0.88 0.012 85)"></path></marker>
          <marker id="mc-arrow-lock" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 z" fill="oklch(0.62 0.21 27)"></path></marker>
          <marker id="mc-arrow-sel" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 z" fill="oklch(0.62 0.21 27)"></path></marker>
        </defs>
        <sc-for list="{{ edgeViews }}" as="e" hint-placeholder-count="0">
          <g>
            <path d="{{ e.d }}" fill="none" stroke="{{ e.stroke }}" stroke-width="{{ e.width }}" stroke-dasharray="{{ e.dash }}" marker-end="{{ e.markerEnd }}" marker-start="{{ e.markerStart }}"></path>
            <path d="{{ e.d }}" fill="none" stroke="transparent" stroke-width="18" style="pointer-events:stroke; cursor:pointer;" onMouseDown="{{ e.onSelect }}" onDoubleClick="{{ e.onSelect }}"></path>
          </g>
        </sc-for>
        <sc-if value="{{ linkOn }}" hint-placeholder-val="{{ false }}">
          <path d="{{ linkD }}" fill="none" stroke="oklch(0.62 0.21 27)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mc-arrow-sel)"></path>
        </sc-if>
      </svg>

      <sc-for list="{{ nodeViews }}" as="n" hint-placeholder-count="0">
        <div data-node="{{ n.id }}" style="{{ n.style }}" onMouseDown="{{ n.onDown }}" onDoubleClick="{{ n.onDbl }}">
          <div style="display:flex; align-items:center; gap:8px; padding:10px 10px 8px 14px; cursor:grab;">
            <input data-name-input="{{ n.id }}" value="{{ n.name }}" onChange="{{ n.onName }}" placeholder="Location name" style="flex:1; min-width:0; background:transparent; border:none; border-bottom:1px solid transparent; padding:1px 0; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:23px; line-height:1.1; text-transform:uppercase; color:oklch(0.96 0.012 85); user-select:text;" style-hover="border-bottom-color:oklch(0.93 0.012 85 / 0.3);" style-focus="border-bottom-color:oklch(0.62 0.21 27);" />
            <button onClick="{{ n.onNotes }}" title="Open this location's notes in the GM panel" style="flex-shrink:0; height:24px; padding:0 8px; background:transparent; border:1px solid oklch(0.93 0.012 85 / 0.3); color:oklch(0.85 0.01 80); font-family:'Barlow',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.1em; cursor:pointer;" style-hover="border-color:oklch(0.62 0.21 27); color:oklch(0.97 0.01 85);">NOTES</button>
            <button onClick="{{ n.onDelete }}" title="Delete location" style="{{ n.delStyle }}">{{ n.delLabel }}</button>
          </div>
          <sc-if value="{{ n.hasHere }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; flex-wrap:wrap; gap:6px; padding:8px 14px; background:oklch(0.93 0.012 85 / 0.07); border-bottom:1px solid oklch(0.93 0.012 85 / 0.18);">
              <sc-for list="{{ n.here }}" as="h" hint-placeholder-count="0">
                <div onMouseDown="{{ h.onDown }}" title="Drag to move" style="display:flex; align-items:center; gap:7px; padding:2px 10px 2px 2px; background:oklch(0.07 0.008 50); border:1px solid oklch(0.93 0.012 85 / 0.4); border-radius:20px; cursor:grab;">
                  <div style="{{ h.avatarStyle }}"></div>
                  <span style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.05em; text-transform:uppercase; line-height:1; color:oklch(0.96 0.012 85);">{{ h.name }}</span>
                </div>
              </sc-for>
            </div>
          </sc-if>
          <button onMouseDown="{{ n.onLinkStart }}" title="Drag onto another location to draw an arrow" style="position:absolute; right:-11px; top:calc(50% - 11px); width:22px; height:22px; padding:0; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#050506; border:1.5px solid oklch(0.55 0.21 27); color:oklch(0.68 0.19 30); font-size:12px; line-height:1; cursor:crosshair;" style-hover="background:oklch(0.55 0.21 27); color:oklch(0.97 0.01 85);">→</button>
        </div>
      </sc-for>

      <sc-for list="{{ labelViews }}" as="l" hint-placeholder-count="0">
        <div style="{{ l.style }}" onMouseDown="{{ l.onDown }}" onDoubleClick="{{ l.onDown }}">
          <sc-if value="{{ l.selected }}" hint-placeholder-val="{{ false }}">
            <div style="width:236px; background:oklch(0.1 0.008 50); border:1px solid oklch(0.55 0.21 27); border-top:3px solid oklch(0.55 0.21 27); box-shadow:0 14px 34px rgba(0,0,0,0.85); padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; cursor:default; animation:mc-in 120ms ease-out both;">
              <div style="font-family:'Barlow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.14em; color:oklch(0.68 0.19 30); text-transform:uppercase; line-height:1.4;">{{ l.title }}</div>
              <textarea data-edge-input="1" rows="3" value="{{ l.label }}" onChange="{{ l.onLabel }}" placeholder="How do you get from here to there?" style="width:100%; resize:vertical; background:oklch(0.07 0.008 50); border:1px solid oklch(0.93 0.012 85 / 0.25); padding:7px 8px; font-family:'Crimson Text',serif; font-size:16px; line-height:1.3; color:oklch(0.93 0.008 80); user-select:text;" style-focus="border-color:oklch(0.62 0.21 27);"></textarea>
              <button onClick="{{ l.onLock }}" style="{{ l.lockPanelStyle }}">{{ l.lockPanelLabel }}</button>
              <div style="display:flex; gap:6px;">
                <button onClick="{{ l.onReverse }}" style="flex:1; padding:6px 0; background:transparent; border:1px solid oklch(0.93 0.012 85 / 0.35); color:oklch(0.88 0.01 80); font-size:11px; letter-spacing:0.12em; cursor:pointer;" style-hover="border-color:oklch(0.95 0.012 85);">REVERSE</button>
                <button onClick="{{ l.onBoth }}" style="{{ l.bothStyle }}">TWO-WAY</button>
                <button onClick="{{ l.onDelete }}" style="flex:1; padding:6px 0; background:transparent; border:1px solid oklch(0.55 0.21 27); color:oklch(0.68 0.19 30); font-size:11px; letter-spacing:0.12em; cursor:pointer;" style-hover="background:oklch(0.55 0.21 27); color:oklch(0.97 0.01 85);">DELETE</button>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ l.pillOn }}" hint-placeholder-val="{{ false }}">
            <div style="max-width:210px; padding:5px 10px 6px; background:oklch(0.1 0.008 50); border:1px solid oklch(0.93 0.012 85 / 0.4); font-family:'Crimson Text',serif; font-style:italic; font-size:15px; line-height:1.28; color:oklch(0.92 0.008 80); text-align:center; text-wrap:pretty; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.7);" style-hover="border-color:oklch(0.62 0.21 27);">{{ l.label }}</div>
          </sc-if>
          <sc-if value="{{ l.badgeOn }}" hint-placeholder-val="{{ true }}">
            <button onMouseDown="{{ l.stop }}" onDoubleClick="{{ l.stop }}" onClick="{{ l.onLock }}" title="{{ l.lockTitle }}" style="{{ l.lockStyle }}"><svg width="12" height="12" viewBox="0 0 12 12" style="display:block;"><rect x="2" y="5.5" width="8" height="5.5" fill="currentColor"></rect><path d="{{ l.shackle }}" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg></button>
          </sc-if>
          <sc-if value="{{ l.dotOn }}" hint-placeholder-val="{{ false }}">
            <div title="{{ l.dotTitle }}" style="{{ l.dotStyle }}" style-hover="border-color:oklch(0.62 0.21 27); background:oklch(0.55 0.21 27);"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="position:absolute; inset:0; pointer-events:none; z-index:4; box-shadow:inset 0 0 160px 30px rgba(0,0,0,0.85);"></div>
    <sc-if value="{{ ghostOn }}" hint-placeholder-val="{{ false }}"><div style="{{ ghostStyle }}"></div></sc-if>
    <div onMouseDown="{{ stop }}" onDoubleClick="{{ stop }}" style="position:absolute; left:20px; top:14px; z-index:6; display:flex; flex-direction:column; align-items:flex-start; gap:6px; cursor:default;">
      <div style="display:flex; align-items:center; gap:12px; padding:8px 12px; background:rgba(4,4,5,0.9); border:1px solid oklch(0.93 0.012 85 / 0.35); min-height:62px;">
        <span style="font-family:'Barlow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.2em; color:oklch(0.68 0.19 30);">PARTY</span>
        <sc-for list="{{ trayTokens }}" as="t" hint-placeholder-count="0">
          <div onMouseDown="{{ t.onDown }}" title="Drag onto a location" style="display:flex; flex-direction:column; align-items:center; gap:3px; cursor:grab;">
            <div style="{{ t.avatarStyle }}"></div>
            <span style="font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.05em; text-transform:uppercase; line-height:1; color:oklch(0.9 0.01 80);">{{ t.name }}</span>
          </div>
        </sc-for>
        <sc-if value="{{ trayMsgOn }}" hint-placeholder-val="{{ false }}"><span style="font-family:'Barlow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.14em; color:oklch(0.6 0.01 70);">{{ trayMsg }}</span></sc-if>
        <span style="width:1px; align-self:stretch; background:oklch(0.93 0.012 85 / 0.25);"></span>
        <div style="display:flex; flex-direction:column; gap:4px;">
          <button onClick="{{ onStarts }}" title="Send the party to their starting points" style="padding:4px 8px; background:transparent; border:1px solid oklch(0.84 0.16 88 / 0.7); color:oklch(0.84 0.16 88); font-size:11px; letter-spacing:0.14em; cursor:pointer;" style-hover="background:oklch(0.84 0.16 88); color:oklch(0.16 0.02 70);">↺ STARTS</button>
          <button onClick="{{ onRoster }}" style="{{ rosterBtnStyle }}">ROSTER</button>
        </div>
      </div>
      <sc-if value="{{ rosterOpen }}" hint-placeholder-val="{{ false }}">
        <div style="padding:10px 12px 12px; background:rgba(4,4,5,0.95); border:1px solid oklch(0.93 0.012 85 / 0.35); animation:mc-in 120ms ease-out both;">
          <div style="font-family:'Barlow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.16em; color:oklch(0.6 0.01 70); margin-bottom:9px;">WHO'S PLAYING</div>
          <div style="display:grid; grid-template-columns:repeat(4,56px); gap:10px 8px;">
            <sc-for list="{{ rosterChars }}" as="r" hint-placeholder-count="0">
              <button onClick="{{ r.onToggle }}" style="display:flex; flex-direction:column; align-items:center; gap:4px; padding:0; background:transparent; border:none; cursor:pointer;">
                <div style="{{ r.avatarStyle }}"></div>
                <span style="{{ r.labelStyle }}">{{ r.name }}</span>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </div>
    
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;onOpenNotes&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=>void&quot;},&quot;embedded&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;characters&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id:string,name:string,avatarUrl:string,avatarPos?:string}[]&quot;}}">
class Component extends DCLogic {
  KEY = 'dryh_madcity_map_v1';
  W = 290;
  chars(){
    const p = this.props.characters;
    const pos = { c6: 'center 45%', c8: 'center 35%' };
    const fb = this.CHARS.map(c => ({ id: c[0], name: c[1], url: encodeURI('uploads/' + c[1] + '-darkroom-1333x2000.png'), pos: pos[c[0]] || 'center 15%' }));
    return Array.isArray(p) && p.length ? p.map(c => ({ id: c.id, name: c.name, url: c.avatarUrl, pos: c.avatarPos || 'center 15%' })) : fb;
  }
  startToken(id, e){
    if (e.button !== 0) return;
    e.stopPropagation(); e.preventDefault();
    const r = this.canvasRef.current.getBoundingClientRect();
    this.drag = { type: 'token', id };
    this.setState({ tokenDrag: { id, x: e.clientX - r.left, y: e.clientY - r.top, over: null }, roster: false });
  }
  setPlace(id, at){ this.setState(s => ({ party: { ...s.party, [id]: { ...(s.party || {})[id], on: true, at } } })); }
  canvasRef = React.createRef();
  sizes = {};
  drag = null;
  focusReq = null;
  state = this.init();

  uid(){ return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  init(){
    const mk = (id, name, x, y, subs) => ({ id, name, x, y, subs: subs.map((s, i) => ({ id: id + '-s' + i, name: s })) });
    const seed = {
      nodes: [
        mk('district13', 'District 13', 40, 140, ['The Precinct Steps', 'The Warrant Office', 'The Holding Cells']),
        mk('bazaar', 'The Bizarre Bazaar', 440, 40, ['The Stalls', 'The Auction Block', 'The Back Alley']),
        mk('rooftop', 'The Rooftop Jungle', 840, 140, ['The Ledges', 'The Vent Maze', 'The Garden Roof']),
        mk('warrens', 'The Warrens', 240, 430, ['The Drainpipes', 'The Wax Line', 'The Underlanding']),
        mk('highschool', 'The High School', 680, 450, ['The Gymnasium', 'The Lockers', "The Principal's Office"]),
      ],
      edges: [], view: { x: 40, y: 20, k: 1 },
    };
    let d = seed;
    try { const raw = localStorage.getItem(this.KEY); if (raw) { const p = JSON.parse(raw); if (p && p.nodes) d = { ...seed, ...p }; } } catch (e) {}
    return { nodes: d.nodes, edges: d.edges, view: d.view, selNode: null, selEdge: null, arm: null, linking: null, pick: null, nm: null, nmPick: null, party: d.party || {}, tokenDrag: null, roster: false };
  }
  CHARS = [['c1','Toad'],['c2','Phee'],['c3','Fat Jack'],['c4','Peter'],['c5','Henry'],['c6','Alice'],['c7','Jane'],['c8','Ben']];
  toggleStart(nodeId, cid){
    this.setState(s => ({ nodes: s.nodes.map(n => {
      const has = (n.starts || []).includes(cid);
      if (n.id === nodeId) return { ...n, starts: has ? n.starts.filter(x => x !== cid) : [...(n.starts || []), cid] };
      return has ? { ...n, starts: n.starts.filter(x => x !== cid) } : n;
    }) }));
  }

  componentDidMount(){
    window.addEventListener('mousemove', this.onMove);
    window.addEventListener('mouseup', this.onUp);
    window.addEventListener('keydown', this.onKey);
    window.addEventListener('dryh-city-edit', this.onExtEdit);
    this.attachWheel();
    this.measure();
  }
  componentWillUnmount(){
    window.removeEventListener('mousemove', this.onMove);
    window.removeEventListener('mouseup', this.onUp);
    window.removeEventListener('keydown', this.onKey);
    window.removeEventListener('dryh-city-edit', this.onExtEdit);
    clearTimeout(this._saveT); this.save();
    if (this._wheelEl) this._wheelEl.removeEventListener('wheel', this.onWheel);
  }
  componentDidUpdate(){
    this.attachWheel();
    this.measure();
    const f = this.focusReq;
    if (f && this.canvasRef.current) {
      const sel = f.type === 'boon' ? `[data-boon-input="${f.id}"]` : f.type === 'nm' ? `[data-nm-input="${f.id}"]` : f.type === 'node' ? `[data-name-input="${f.id}"]` : f.type === 'sub' ? `[data-sub-input="${f.id}"]` : '[data-edge-input]';
      const el = this.canvasRef.current.querySelector(sel);
      if (el) { this.focusReq = null; el.focus(); if (f.type !== 'sub') el.select && el.select(); }
    }
    clearTimeout(this._saveT);
    if (this._ext) { this._ext = false; return; }
    this._saveT = setTimeout(() => {
      this.save();
    }, 250);
  }

  save(){ const { nodes, edges, view, party } = this.state; try { localStorage.setItem(this.KEY, JSON.stringify({ nodes, edges, view, party })); } catch (e) {} window.dispatchEvent(new Event('dryh-map-saved')); }
  onExtEdit = () => { try { const p = JSON.parse(localStorage.getItem(this.KEY) || 'null'); if (p && p.nodes) { this._ext = true; this.setState({ nodes: p.nodes, edges: p.edges || [] }); } } catch (e) {} };
  attachWheel(){
    const el = this.canvasRef.current;
    if (el && this._wheelEl !== el) {
      if (this._wheelEl) this._wheelEl.removeEventListener('wheel', this.onWheel);
      el.addEventListener('wheel', this.onWheel, { passive: false });
      this._wheelEl = el;
    }
  }
  measure(){
    const el = this.canvasRef.current; if (!el) return;
    let changed = false;
    el.querySelectorAll('[data-node]').forEach(n => {
      const id = n.getAttribute('data-node'), h = n.offsetHeight, w = n.offsetWidth;
      const o = this.sizes[id];
      if (!o || o.h !== h || o.w !== w) { this.sizes[id] = { w, h }; changed = true; }
    });
    if (changed) this.forceUpdate();
  }

  toWorld(e){
    const r = this.canvasRef.current.getBoundingClientRect(), v = this.state.view;
    return { x: (e.clientX - r.left - v.x) / v.k, y: (e.clientY - r.top - v.y) / v.k };
  }

  onWheel = (e) => {
    if (e.target.closest && e.target.closest('textarea') && !e.ctrlKey) return;
    e.preventDefault();
    const v = this.state.view;
    if (e.ctrlKey || e.metaKey) {
      const r = this.canvasRef.current.getBoundingClientRect();
      this.zoomAt(v, e.clientX - r.left, e.clientY - r.top, v.k * Math.exp(-e.deltaY * 0.01));
    } else {
      this.setState({ view: { ...v, x: v.x - e.deltaX, y: v.y - e.deltaY } });
    }
  };
  zoomAt(v, cx, cy, nk){
    nk = Math.max(0.25, Math.min(2, nk));
    const wx = (cx - v.x) / v.k, wy = (cy - v.y) / v.k;
    this.setState({ view: { x: cx - wx * nk, y: cy - wy * nk, k: nk } });
  }

      onImportMd: () => window.MadCityIO.importFlow({ get: () => ({ nodes: this.state.nodes, edges: this.state.edges, view: this.state.view, party: this.state.party }),
        apply: (d) => { this.setState({ nodes: d.nodes, edges: d.edges }); setTimeout(() => { this.save(); this.fit(); }, 0); } }),
      onZoomIn: () => this.zoomBy(1.2), onZoomOut: () => this.zoomBy(1 / 1.2), onFit: () => this.fit(),
      onCanvasDown: this.onCanvasDown, onCanvasDbl: this.onCanvasDbl,
    };
  }
}

</script>
</body>
