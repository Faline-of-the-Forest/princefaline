<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokyo Brain Pop — Headmaster's Desk</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="site-chrome">
<div class="site-card" style="max-width:560px">
  <div class="site-eyebrow">◆ Headmaster's Desk — GM only</div>
  <h1>Run a Game</h1>
  <p class="site-sub">This is the Headmaster's entry point, separate from the player join screen. Open or create a room to get Scene Control, or manage rooms below.</p>

  <form id="open-form">
    <div class="site-field">
      <label for="room-name">Room name</label>
      <input class="site-input" id="room-name" name="room-name" autocomplete="off" placeholder="e.g. class-2a" maxlength="40" required>
    </div>
    <button type="submit" class="site-btn" id="open-btn">Open Scene Control</button>
  </form>
  <div id="open-error" class="site-error" style="display:none"></div>

  <hr style="border:none;border-top:1px solid var(--site-line);margin:26px 0">

  <div class="tbp-flex-between" style="margin-bottom:10px">
    <div class="site-eyebrow" style="margin:0">◆ All Rooms</div>
  </div>
  <div id="room-list"><p class="site-sub" style="margin:0">Loading rooms…</p></div>

  <div style="margin-top:22px;text-align:center">
    <a class="site-link" href="index.html">← Back to the player join screen</a>
  </div>
</div>

<script type="module">
  import { connectRoom, joinRoom, getSessionId, listRooms, deleteRoom, isConfigured } from './js/firebase-sync.js';

  const form = document.getElementById('open-form');
  const err = document.getElementById('open-error');
  const btn = document.getElementById('open-btn');
  const listEl = document.getElementById('room-list');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none';
    const roomName = document.getElementById('room-name').value.trim();
    if (!roomName) return;
    btn.disabled = true;
    btn.textContent = 'Opening…';
    try {
      const { id } = await connectRoom(roomName);
      await joinRoom({ sessionId: getSessionId(), name: 'Headmaster', role: 'gm' });
      location.href = 'room.html?r=' + encodeURIComponent(id) + '&gm=1';
    } catch (ex) {
      console.error(ex);
      err.textContent = ex.message || 'Could not open that room.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Open Scene Control';
    }
  });

  function fmtStatus(s) {
    return { lobby: 'Lobby', 'demon-select': 'Demon Select', playing: 'Playing', ended: 'Ended' }[s] || s;
  }

  function render(rooms) {
    if (!isConfigured()) {
      listEl.innerHTML = '<p class="site-sub" style="margin:0">Firebase isn\'t configured yet — paste your project config into <code>app/js/firebase-sync.js</code> to see live rooms here.</p>';
      return;
    }
    if (!rooms.length) {
      listEl.innerHTML = '<p class="site-sub" style="margin:0">No rooms yet. Open one above.</p>';
      return;
    }
    listEl.innerHTML = rooms.map(r => `
      <div class="room-list-item">
        <div>
          <div style="font:400 17px/1.3 'EB Garamond',serif">${escapeHtml(r.name)}</div>
          <div class="meta">${r.playerCount} joined</div>
        </div>
        <div class="site-row">
          <span class="room-status-pill ${r.status}">${fmtStatus(r.status)}</span>
          <a class="site-btn ghost" style="width:auto;margin:0;padding:8px 12px" href="room.html?r=${encodeURIComponent(r.id)}&gm=1">Open</a>
          <button class="site-btn danger" style="width:auto;margin:0;padding:8px 12px" data-del="${r.id}" data-name="${escapeHtml(r.name)}">Delete</button>
        </div>
      </div>
    `).join('');
    listEl.querySelectorAll('[data-del]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!confirm(`Delete room "${b.dataset.name}"? This wipes all its state permanently.`)) return;
        b.disabled = true;
        try { await deleteRoom(b.dataset.del); } catch (ex) { alert(ex.message); b.disabled = false; }
      });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  if (isConfigured()) {
    listRooms(render);
  } else {
    render([]);
  }
</script>
</body>
</html>
