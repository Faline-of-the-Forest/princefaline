<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D2232A&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#D2232A&quot;,&quot;#E0217E&quot;,&quot;#1F4FD8&quot;,&quot;#0F8F5C&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;showHalftone&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Look&quot;}}">
const ITEMS = [
  { tag: "ROOM 作成 / HOST A SORTIE", body: "Open a new containment cell. Set the ward, pick a demon tier, and call in up to three espers." },
  { tag: "参加 / 6-DIGIT PSI CODE", body: "Drop into a sortie already in progress. Bring a clean uniform — the last one didn't come back." },
  { tag: "校長室 / PROGRESS & SECRETS", body: "Report to the Headmaster. Ranks, brain-pop upgrades, and the files she keeps in the locked drawer." },
  { tag: "チュートリアル / ORIENTATION", body: "Learn the ropes before your first sortie." }
];
const ACTIONS = [
  "CELL OPEN — ROOM CODE PSI-4417 — WAITING FOR ALLIES…",
  "AWAITING PSI CODE INPUT…",
  "SUMMONED. THE HEADMASTER IS LISTENING.",
  "ORIENTATION COMING SOON."
];

class TBPHomeBase extends DCLogic {
  state = { sel: 0, flash: 0, status: "STANDBY — SELECT A CHANNEL" };

  componentDidMount() {
    this.fit();
    this.onResize = () => this.fit();
    window.addEventListener("resize", this.onResize);
    if (typeof ResizeObserver !== "undefined" && this.rootEl) {
      this.ro = new ResizeObserver(() => this.fit());
      this.ro.observe(this.rootEl);
    }
    setTimeout(() => this.fit(), 0);
    this.onKey = (e) => {
      const k = e.key;
      if (k === "ArrowDown" || k === "ArrowRight") { e.preventDefault(); this.move(1); }
      else if (k === "ArrowUp" || k === "ArrowLeft") { e.preventDefault(); this.move(-1); }
      else if (k === "Enter" || k === " ") { e.preventDefault(); this.activate(this.state.sel); }
    };
    window.addEventListener("keydown", this.onKey);
  }
  componentDidUpdate() { this.fit(); }
  componentWillUnmount() {
    window.removeEventListener("resize", this.onResize);
    window.removeEventListener("keydown", this.onKey);
    if (this.ro) this.ro.disconnect();
    cancelAnimationFrame(this.raf);
    clearTimeout(this.t);
  }

  fit() {
    const el = this.rootEl;
    if (!el) return;
    this.applyVars();
    const r = el.getBoundingClientRect();
    const w = r.width || window.innerWidth || 0;
    const h = r.height || window.innerHeight || 0;
    const scale = Math.min(w / 1920, h / 1080);
    if (scale > 0) {
      el.style.setProperty("--tbp-scale", String(scale));
      return;
    }
    cancelAnimationFrame(this.raf);
    this.raf = requestAnimationFrame(() => this.fit());
  }

  applyVars() {
    const el = this.rootEl;
    if (!el) return;
    const accent = this.props.accentColor ?? "#D2232A";
    el.style.setProperty("--tbp-accent", accent);
    el.style.setProperty("--tbp-dots", (this.props.showHalftone ?? true) ? "0.16" : "0");
  }

  move(d) { this.setState((s) => ({ sel: (s.sel + d + ITEMS.length) % ITEMS.length })); }

  activate(i) {
    clearTimeout(this.t);
    this.setState({ sel: i, flash: 0.9, status: ACTIONS[i] });
    this.t = setTimeout(() => this.setState({ flash: 0 }), 70);
  }

  renderVals() {
    const accent = this.props.accentColor ?? "#D2232A";
    const sel = this.state.sel;
    const vals = {
      rootRef: (el) => { this.rootEl = el; if (el) this.fit(); },
      flash: this.state.flash
    };
    for (let i = 0; i < ITEMS.length; i++) {
      const on = i === sel;
      vals["bg" + i] = on ? accent : "#100D0B";
      vals["fg" + i] = on ? "#fff" : "#EEE41B";
      vals["tf" + i] = on ? "skewX(-9deg) translateX(38px) scale(1.035)" : "skewX(-9deg) translateX(0) scale(1)";
      vals["sh" + i] = on ? "12px 12px 0 #100D0B, inset 0 0 0 5px #100D0B" : "7px 7px 0 rgba(16,13,11,.3)";
      vals["ar" + i] = on ? 1 : 0;
      vals["hover" + i] = () => this.setState({ sel: i });
      vals["go" + i] = () => this.activate(i);
    }
    return vals;
  }
}

/* ============================================================================
   Title screen navigation.

   Everything above is the original "Tokyo Brain Pop - Home" component exactly
   as designed; only its class declaration was renamed so it can be extended.
   This overrides one method — activate() — to send the three menu items
   somewhere. The flash, the status line and every pixel of the screen are the
   original's, untouched.
   ========================================================================= */
class Component extends TBPHomeBase {
  activate(i) {
    super.activate(i);            // keep the original flash + status line
    setTimeout(function () {
      var H = window.TBPHome;
      if (!H) return;             // network layer still loading
      if (i === 0) H.createRoom();
      else if (i === 1) H.joinRoom();
      else if (i === 2) H.headmaster();
      // i === 3: Tutorial — coming soon, no destination yet.
    }, 90);
  }
}

</script>
