backend:
  name: github
  repo: Faline-of-the-Forest/princefaline
  branch: main
  base_url: https://princefaline.com
  auth_endpoint: oauth/auth

publish_mode: simple
media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "sessions"
    label: "Ledger (all sessions)"
    files:
      - file: "content/sessions.json"
        label: "Session Ledger"
        name: "sessions"
        fields:
          - { label: "Sessions", name: "sessions", widget: "list", summary: "{{fields.d}} — {{fields.t}}", fields:
              - { label: "Session #", name: "n", widget: "number" }
              - { label: "Date", name: "d", widget: "string", hint: "YYYY-MM-DD" }
              - { label: "Title", name: "t", widget: "string" }
              - { label: "Campaign (exact name, or One-Shot)", name: "c", widget: "string" }
              - { label: "System", name: "s", widget: "string" }
              - { label: "Hours (decimal)", name: "h", widget: "number", value_type: "float" }
              - { label: "Runtime (HH:MM)", name: "rt", widget: "string" }
            }

  - name: "campaigns"
    label: "Campaigns"
    folder: "content/campaigns"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "name"
    fields:
      - { label: "Slug (url-safe, e.g. bloodletting)", name: "slug", widget: "string" }
      - { label: "Name (must match ledger entries exactly)", name: "name", widget: "string" }
      - { label: "System", name: "sys", widget: "string" }
      - { label: "Status", name: "status", widget: "select", options: ["running", "between arcs", "concluded"] }
      - { label: "Banner image URL", name: "banner", widget: "image", required: false }
      - { label: "Cover images (one per episode, in order)", name: "covers", widget: "list", field: { label: "Cover", name: "cover", widget: "image" }, required: false }
      - { label: "Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" }, required: false }
      - { label: "Tagline", name: "tagline", widget: "string", required: false }
      - { label: "Premise (one paragraph per item)", name: "premise", widget: "list", field: { label: "Paragraph", name: "p", widget: "text" }, required: false }
      - { label: "Influences", name: "influences", widget: "text", required: false }
      - { label: "Materials (review titles this campaign uses)", name: "materials", widget: "list", field: { label: "Title", name: "m", widget: "string" }, required: false }
      - label: "Cast"
        name: "cast"
        widget: "list"
        required: false
        summary: "{{fields.name}}"
        fields:
          - { label: "Character name", name: "name", widget: "string" }
          - { label: "Kind/Faction", name: "kind", widget: "string" }
          - { label: "Player", name: "player", widget: "string" }
          - { label: "Bio", name: "bio", widget: "text" }
      - label: "Episodes"
        name: "episodes"
        widget: "list"
        required: false
        summary: "{{fields.n}}. {{fields.title}}"
        fields:
          - { label: "Episode #", name: "n", widget: "string" }
          - { label: "Date", name: "date", widget: "string", hint: "YYYY-MM-DD" }
          - { label: "Runtime (HH:MM)", name: "rt", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Hook / summary", name: "hook", widget: "text" }

  - name: "reviews"
    label: "Reviews"
    folder: "content/reviews"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "t"
    fields:
      - { label: "Slug (url-safe)", name: "slug", widget: "string" }
      - { label: "Title", name: "t", widget: "string" }
      - { label: "Edition (optional, e.g. 2e)", name: "ed", widget: "string", required: false }
      - { label: "System", name: "sys", widget: "string" }
      - { label: "Type", name: "type", widget: "select", options: ["System", "Module", "Supplement", "Resource"] }
      - { label: "Stars (1-5)", name: "stars", widget: "number", min: 1, max: 5 }
      - { label: "Date reviewed", name: "date", widget: "string", hint: "YYYY-MM" }
      - { label: "Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" }, required: false }
      - { label: "Verdict (one-line)", name: "verdict", widget: "string" }
      - { label: "Body", name: "body", widget: "text" }
      - { label: "Used in (campaign names or One-Shots)", name: "used", widget: "list", field: { label: "Name", name: "u", widget: "string" }, required: false }

  - name: "dashboards"
    label: "Games"
    files:
      - file: "content/dashboards.json"
        label: "Games List"
        name: "dashboards"
        fields:
          - { label: "Games", name: "dashboards", widget: "list", summary: "{{fields.t}}", fields:
              - { label: "Title", name: "t", widget: "string" }
              - { label: "Campaign", name: "c", widget: "string" }
              - { label: "System", name: "sys", widget: "string" }
              - { label: "Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" }, required: false }
              - { label: "Note", name: "note", widget: "text" }
              - { label: "Live URL", name: "url", widget: "string" }
              - { label: "Host label", name: "host", widget: "string", required: false }
            }
